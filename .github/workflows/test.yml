name: test
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python skills/aso-listing-writer/scripts/check_listing.py skills/aso-listing-writer/assets/listing.example.json
